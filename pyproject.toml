[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-archive-scraper"
version = "1.0.0"
description = "Source archival photos and film of the American electric grid buildout (1930s-1950s) from the Library of Congress and the Internet Archive."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
judge = ["anthropic>=0.42"]
pdf = ["pdfplumber>=0.11"]
llm = ["anthropic>=0.42"]
expense = ["pdfplumber>=0.11", "anthropic>=0.42"]

[project.scripts]
grid-archive-scraper = "grid_archive.cli:main"
expense-report = "expense_report.cli:main"

[tool.setuptools]
py-modules = ["config", "expense_config"]
packages = ["grid_archive", "grid_archive.fetchers", "expense_report"]
