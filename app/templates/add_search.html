{% extends "base.html" %}
{% block title %}New Search - Job Search Bot{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2>Create Search</h2>
        <p class="text-muted">Set up an automated job search across multiple boards.</p>

        <form action="{{ url_for('jobs.add_search') }}" method="post">
            <div class="card">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Search Name *</label>
                            <input type="text" name="name" class="form-control" required
                                   placeholder="e.g. Python Backend Roles">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Search Keywords *</label>
                            <textarea name="search_terms" class="form-control" rows="2" required
                                      placeholder="python developer, backend engineer, django developer"></textarea>
                            <div class="form-text">Comma-separated. Each keyword runs as a separate search.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Job Boards</label>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input board-check" value="indeed" id="board_indeed" checked>
                                <label class="form-check-label" for="board_indeed">Indeed</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input board-check" value="linkedin" id="board_linkedin" checked>
                                <label class="form-check-label" for="board_linkedin">LinkedIn</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input board-check" value="glassdoor" id="board_glassdoor" checked>
                                <label class="form-check-label" for="board_glassdoor">Glassdoor</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input board-check" value="zip_recruiter" id="board_zip" checked>
                                <label class="form-check-label" for="board_zip">ZipRecruiter</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input board-check" value="google" id="board_google" checked>
                                <label class="form-check-label" for="board_google">Google Jobs</label>
                            </div>
                            <input type="hidden" name="boards" id="boards_hidden" value="indeed,linkedin,glassdoor,zip_recruiter,google">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control"
                                   placeholder="e.g. New York, NY (leave blank for any)">
                            <div class="form-check mt-2">
                                <input type="checkbox" name="remote_only" class="form-check-input" id="remote_only">
                                <label class="form-check-label" for="remote_only">Remote only</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Results per Search</label>
                            <input type="number" name="results_wanted" class="form-control" value="25" min="5" max="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Run Every (hours)</label>
                            <input type="number" name="interval_hours" class="form-control" value="24" min="1" max="168">
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i> Create Search
                    </button>
                    <a href="{{ url_for('jobs.search_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.querySelectorAll('.board-check').forEach(cb => {
    cb.addEventListener('change', () => {
        const checked = [...document.querySelectorAll('.board-check:checked')].map(c => c.value);
        document.getElementById('boards_hidden').value = checked.join(',');
    });
});
</script>
{% endblock %}
